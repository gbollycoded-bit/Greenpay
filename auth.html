<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenPay — Login / Sign Up</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#02150d;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:430px;background:#031b11;border:1px solid #185d38;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0008}
.logo{font-size:28px;font-weight:800;color:#16ef61;margin-bottom:28px}.logo span{color:#fff}
h1{margin:0 0 8px;font-size:30px}.sub{color:#9db1a5;line-height:1.5;margin-bottom:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#062719;padding:4px;border-radius:12px;margin-bottom:22px}
.tab{border:0;background:transparent;color:#9db1a5;padding:12px;border-radius:9px;font-weight:700;font-size:15px}.tab.active{background:#12e95a;color:#00180b}
label{display:block;margin:15px 0 7px;color:#cbd8d1;font-size:14px}
input{width:100%;padding:14px;border:1px solid #245f3e;border-radius:11px;background:#02150d;color:#fff;font-size:16px;outline:none}input:focus{border-color:#16ef61}
.submit{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:#12e95a;color:#00180b;font-weight:800;font-size:16px}
.back{display:block;text-align:center;margin-top:20px;color:#8fffb2;text-decoration:none}
.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;line-height:1.4}
.note{margin-top:20px;padding:12px;border-radius:10px;background:#08281a;color:#9db1a5;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="box">
<div class="logo">G <span>GreenPay</span></div>
<h1 id="title">Welcome back</h1>
<div class="sub" id="subtitle">Log in to access your GreenPay account.</div>
<div class="tabs"><button class="tab active" id="loginTab" type="button">Login</button><button class="tab" id="signupTab" type="button">Sign Up</button></div>
<form id="authForm">
<div id="nameField" style="display:none"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" placeholder="Your full name"></div>
<label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
<label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters">
<button class="submit" id="submitBtn" type="submit">Login</button>
</form>
<div class="msg" id="message"></div>
<div class="note">This page is the GreenPay authentication interface. Real account creation/login requires connecting an authentication service such as Supabase.</div>
<a class="back" href="index.html">← Back to GreenPay</a>
</div>
<script>
const params=new URLSearchParams(location.search);let mode=params.get("mode")==="signup"?"signup":"login";
const loginTab=document.getElementById("loginTab"),signupTab=document.getElementById("signupTab"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle"),nameField=document.getElementById("nameField"),nameInput=document.getElementById("name"),submitBtn=document.getElementById("submitBtn"),message=document.getElementById("message"),form=document.getElementById("authForm");
function setMode(m){mode=m;let s=m==="signup";loginTab.classList.toggle("active",!s);signupTab.classList.toggle("active",s);nameField.style.display=s?"block":"none";nameInput.required=s;title.textContent=s?"Create your account":"Welcome back";subtitle.textContent=s?"Create your GreenPay account to get started.":"Log in to access your GreenPay account.";submitBtn.textContent=s?"Create Account":"Login";let u=new URL(location.href);u.searchParams.set("mode",mode);history.replaceState({},"",u);message.style.display="none"}
loginTab.onclick=()=>setMode("login");signupTab.onclick=()=>setMode("signup");
form.onsubmit=e=>{e.preventDefault();message.style.display="block";message.style.background="#08281a";message.style.color="#9dffbc";message.textContent=mode==="signup"?"Your signup form is ready. Connect GreenPay to an authentication backend to create real accounts.":"Your login form is ready. Connect GreenPay to an authentication backend to sign in."};
setMode(mode);
</script>
</body>
</html>
